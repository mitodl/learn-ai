[pytest]
addopts = --cov . --cov-report term --cov-report html --cov-report xml --ds=main.settings --reuse-db
norecursedirs = node_modules .git .tox static templates .* CVS _darcs {arch} *.egg
asyncio_mode=auto
markers =
  betamax: test requires betamax

# In addition to existing env variables
env =
  CELERY_TASK_ALWAYS_EAGER=True
  DEBUG=False
  MITOL_COOKIE_DOMAIN=localhost
  MITOL_COOKIE_NAME=cookie_monster
  MITOL_FEATURES_DEFAULT=False
  MITOL_SECURE_SSL_REDIRECT=False
  MITOL_USE_S3=False
  SENTRY_DSN=
  POSTHOG_PERSONAL_API_KEY=fake_key # pragma: allowlist secret
  POSTHOG_PROJECT_API_KEY=fake_key # pragma: allowlist secret
  POSTHOG_PROJECT_ID=1234
  # Pinned for the same reason as the Zendesk settings below: the origin check
  # keys off this, so a local .env would otherwise decide whether those tests
  # expect 200 or 403.
  AI_CHATBOTS_COOKIE_CROSS_SITE=False
  # Pinned so a developer's local .env cannot change what the suite tests:
  # live Zendesk credentials would put real tickets in front of the tests.
  AI_ZENDESK_STUB_MODE=True
  AI_ZENDESK_API_URL=
  AI_ZENDESK_OAUTH_CLIENT_ID=
  AI_ZENDESK_OAUTH_CLIENT_SECRET=
  AI_ZENDESK_URL_FIELD_ID=0
  AI_ZENDESK_NAME_FIELD_ID=0
  AI_ZENDESK_USERNAME_FIELD_ID=0
