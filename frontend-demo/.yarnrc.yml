nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.12.0.cjs
enableScripts: false

# Worker-thread zip conversion holds one libzip WASM heap per CPU; the ~135MB next/@next-swc
# tarballs push the 3GB Mend Renovate runner into kernel OOM. Off-heap, so NODE_OPTIONS can't cap it.
taskPoolMode: async
